workflows:
  nexedit-android:
    name: NexEdit Studio X - Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2   # অথবা linux_x2
    environment:
      android_signing:
        - my_keystore   # এটা পরে Codemagic-এ সেট করবেন
      vars:
        PACKAGE_NAME: "com.aistudio.nexedit.studio.app"
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build Release AAB
        script: |
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
    publishing:
      # email: 
      #   recipients:
      #     - your@email.com